# 服务器配置
server.port=8080
server.servlet.context-path=/api

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/rideshare?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# JWT配置
app.jwt.secret=3d28f6e9a12d489281e9d286a9b6cf03983b7fc8952c4e0f94f7a97d7d52cc0b
app.jwt.expiration=86400000

# 验证码配置
app.verification.expiration=300

# 添加Amazon SES配置
aws.ses.access-key=YOUR_AWS_ACCESS_KEY
aws.ses.secret-key=YOUR_AWS_SECRET_KEY
aws.ses.region=us-east-1
aws.ses.from-email=your-verified-email@example.com 